<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Replanteo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF1F4; color: #10161D; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

<header style="background: #10161D; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
<a href="Inicio.dc.html" aria-label="Volver a la obra" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1">
<div style="font-size: 17px; font-weight: 700">Replantear · <span class="mono">0+060</span></div>
<div style="font-size: 13px; color: #AEB8C2">Av. Sol · Subrasante · AI <span class="mono">3246.632</span></div>
</div>
</header>

<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0">
<div role="group" aria-label="Estaca" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{puntos}}" as="p" hint-placeholder-count="5">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="min-height: 44px; border-radius: 8px; border: 2px solid {{p.borde}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 12px; font-weight: 600; padding: 2px">{{p.nombre}}</button>
</sc-for>
</div>

<div style="background: #10161D; color: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-end">
<div>
<div style="font-size: 13px; color: #AEB8C2">La mira debe marcar</div>
<div class="mono" style="font-size: 44px; font-weight: 600; line-height: 1.05; color: #FDBA74">{{objetivo}}</div>
</div>
<div style="text-align: right; font-size: 13px; color: #D7DDE3">cota de proyecto<br><span class="mono" style="font-size: 16px; color: #FFFFFF">{{proyecto}}</span></div>
</div>

<div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0">
<div style="position: relative; background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 10px; overflow: hidden" aria-hidden="true">
<div style="position: absolute; left: 34px; top: 8px; bottom: 8px; width: 28px; background: repeating-linear-gradient(180deg, #F2C200 0 10px, #FFFFFF 10px 20px); border: 1px solid #10161D"></div>
<div style="position: absolute; left: 4px; right: 4px; top: 50%; border-top: 2px dashed #1D4ED8"></div>
<span style="position: absolute; right: 4px; top: calc(50% - 16px); font-size: 10px; color: #1D4ED8">objetivo</span>
<div style="position: absolute; left: 4px; right: 4px; top: {{mira}}%; border-top: 3px solid {{color}}"></div>
<span style="position: absolute; left: 4px; top: calc({{mira}}% + 3px); font-size: 10px; font-weight: 600; color: {{color}}">leída</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="leida" style="font-size: 14px; color: #2C3640">La mira marca (m)</label>
<input id="leida" class="mono" inputmode="decimal" value="{{leida}}" onChange="{{onLeida}}" style="height: 60px; border: 2px solid #10161D; border-radius: 10px; font-size: 30px; padding: 0 12px; box-sizing: border-box; width: 100%">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
<button type="button" onClick="{{menos}}" class="mono" style="height: 44px; border: 1px solid #C3CAD2; border-radius: 8px; background: #FFFFFF; color: #10161D; font-size: 15px">−1 mm</button>
<button type="button" onClick="{{mas}}" class="mono" style="height: 44px; border: 1px solid #C3CAD2; border-radius: 8px; background: #FFFFFF; color: #10161D; font-size: 15px">+1 mm</button>
</div>
<div style="background: {{bg}}; color: {{color}}; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 30px; font-weight: 700; line-height: 1.1; text-transform: uppercase">{{veredicto}}</div>
<div style="font-size: 14px">{{detalle}}</div>
</div>
</div>
</div>

<div style="font-size: 13px; color: #4A5561">Marca más que el objetivo → falta, rellena. Marca menos → sobra, corta.</div>
<div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px">
<button type="button" style="height: 52px; border: 1px solid #C3CAD2; border-radius: 12px; background: #FFFFFF; color: #10161D; font-size: 15px">Anotar en estaca</button>
<button type="button" onClick="{{siguiente}}" style="height: 52px; border: 0; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 16px; font-weight: 700">Siguiente estaca ›</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var AI = 3246.632;
var PTS = [
  { nombre: 'Sard. izq', caida: 0.084, dif: 18 },
  { nombre: 'Borde izq', caida: 0.072, dif: 15 },
  { nombre: 'Eje', caida: 0, dif: 12 },
  { nombre: 'Borde der', caida: 0.072, dif: 10 },
  { nombre: 'Sard. der', caida: 0.084, dif: 8 }
];
function disenio(i) { return 3244.730 - 0.0125 * 60 - PTS[i].caida; }
function inicial() { return PTS.map(function (p, i) { return (AI - disenio(i) - p.dif / 1000).toFixed(3); }); }

class Component extends DCLogic {
  state = { i: 2, leidas: inicial() };

  renderVals() {
    var s = this.state, self = this;
    var obj = AI - disenio(s.i);
    var texto = s.leidas[s.i];
    var v = parseFloat(String(texto).replace(',', '.'));
    var cambiar = function (t) { var l = s.leidas.slice(); l[s.i] = t; self.setState({ leidas: l }); };
    var paso = function (mm) { return function () { var x = parseFloat(String(s.leidas[s.i]).replace(',', '.')); if (!isNaN(x)) cambiar((x + mm / 1000).toFixed(3)); }; };

    var veredicto = '—', detalle = 'Escribe lo que marca la mira', color = '#55606B', bg = '#FFFFFF', mira = 50;
    if (!isNaN(v)) {
      var d = Math.round((obj - v) * 1000);
      var a = Math.abs(d);
      if (d > 0) { veredicto = 'Corta ' + a + ' mm'; detalle = 'Sobra material sobre la estaca'; }
      else if (d < 0) { veredicto = 'Rellena ' + a + ' mm'; detalle = 'Falta material sobre la estaca'; }
      else { veredicto = 'En cota'; detalle = 'Clavado en el proyecto'; }
      var est = a <= 20 ? ['#0B5E56', '#E3F2EF', '✓ dentro de ±20 mm'] : (a <= 40 ? ['#7A4A00', '#FBF0D9', '△ al límite'] : ['#9F1B1B', '#FBE3E3', '✗ fuera de tolerancia']);
      color = est[0]; bg = est[1]; detalle = detalle + ' · ' + est[2];
      mira = Math.max(6, Math.min(94, 50 - (v - obj) * 1000 * 0.7));
    }

    return {
      puntos: PTS.map(function (p, i) {
        var on = i === s.i;
        return { nombre: p.nombre, on: on ? 'true' : 'false', borde: on ? '#10161D' : '#D5DAE0', bg: on ? '#10161D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#10161D', pick: function () { self.setState({ i: i }); } };
      }),
      objetivo: obj.toFixed(3), proyecto: disenio(s.i).toFixed(3), leida: texto,
      veredicto: veredicto, detalle: detalle, color: color, bg: bg, mira: mira.toFixed(1),
      onLeida: function (ev) { cambiar(ev.target.value); },
      menos: paso(-1), mas: paso(1),
      siguiente: function () { self.setState({ i: (s.i + 1) % PTS.length }); }
    };
  }
}
</script>
</body>
</html>
