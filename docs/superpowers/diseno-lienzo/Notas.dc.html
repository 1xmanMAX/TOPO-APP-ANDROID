<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notas y fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF1F4; color: #10161D; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

<header style="background: #10161D; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
<a href="Inicio.dc.html" aria-label="Volver a la obra" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1">
<div style="font-size: 17px; font-weight: 700">Notas de Av. Sol</div>
<div style="font-size: 13px; color: #AEB8C2">Salen en el mapa y en los informes</div>
</div>
</header>

<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #D5DAE0">
<div style="display: flex; gap: 6px; align-items: center">
<span style="font-size: 14px; color: #4A5561">En</span>
<sc-for list="{{progs}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" class="mono" style="min-height: 40px; padding: 0 8px; border-radius: 8px; border: 1px solid {{p.borde}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px">{{p.t}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{rapidas}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" style="min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid #C3CAD2; background: #F7F8FA; color: #10161D; font-size: 13px">{{r.t}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<label for="nuevaNota" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nota</label>
<input id="nuevaNota" value="{{texto}}" onChange="{{onTexto}}" placeholder="Escribe o toca una de arriba" style="flex: 1; min-width: 0; height: 48px; border: 1px solid #8B96A2; border-radius: 10px; font-size: 15px; padding: 0 12px; font-family: inherit">
<button type="button" aria-label="Añadir foto" style="width: 48px; height: 48px; border: 1px solid #C3CAD2; border-radius: 10px; background: #FFFFFF; color: #10161D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
<button type="button" onClick="{{guardar}}" style="height: 48px; padding: 0 14px; border: 0; border-radius: 10px; background: #C2410C; color: #FFFFFF; font-size: 15px; font-weight: 600">Añadir</button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{notas}}" as="n" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 56px; flex: none">
<span class="mono" style="font-size: 14px; font-weight: 600">{{n.prog}}</span>
<span style="font-size: 11px; color: #4A5561">{{n.hora}}</span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px">{{n.texto}}</span>
<sc-if value="{{n.foto}}" hint-placeholder-val="{{ false }}">
<div style="height: 84px; border-radius: 8px; background: #DCE3EA; color: #4A5561; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>[foto de campo]</div>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var PROGS = ['0+040', '0+060', '0+080', '0+100'];
class Component extends DCLogic {
  state = {
    prog: 1, texto: '',
    notas: [
      { prog: '0+080', hora: '10:12', texto: 'Material acopiado sobre el eje: lectura del eje tomada al costado.', foto: true },
      { prog: '0+040', hora: '09:31', texto: 'Buzón de desagüe a 0.30 m bajo subrasante. Avisar al residente.', foto: true },
      { prog: '0+000', hora: '08:40', texto: 'Se arranca de BM-1, esquina Sol con Lima.', foto: false }
    ]
  };
  renderVals() {
    var s = this.state, self = this;
    return {
      progs: PROGS.map(function (t, i) { var on = i === s.prog; return { t: t, on: on ? 'true' : 'false', bg: on ? '#10161D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#10161D', borde: on ? '#10161D' : '#C3CAD2', pick: function () { self.setState({ prog: i }); } }; }),
      rapidas: ['Buzón', 'Sardinel vaciado', 'Material acopiado', 'Interferencia', 'Agua empozada'].map(function (t) { return { t: t, pick: function () { self.setState({ texto: t }); } }; }),
      texto: s.texto, notas: s.notas,
      onTexto: function (ev) { self.setState({ texto: ev.target.value }); },
      guardar: function () {
        if (!s.texto.trim()) return;
        self.setState({ texto: '', notas: [{ prog: PROGS[s.prog], hora: 'ahora', texto: s.texto, foto: false }].concat(s.notas) });
      }
    };
  }
}
</script>
</body>
</html>
