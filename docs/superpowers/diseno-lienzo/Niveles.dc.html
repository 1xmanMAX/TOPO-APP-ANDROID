<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Niveles de la capa siguiente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EEF1F4; color: #10161D; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

<header style="background: #10161D; color: #FFFFFF; padding: 12px 16px">
<div style="font-size: 13px; color: #AEB8C2">Av. Sol · Replantear · Desde una capa medida</div>
<div style="font-size: 19px; font-weight: 700">Base = subrasante + 0.20 m</div>
</header>

<div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 12px; padding: 4px; gap: 4px">
<sc-for list="{{lados}}" as="l" hint-placeholder-count="3">
<button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: {{l.bg}}; color: {{l.fg}}; font-size: 14px; font-weight: 600">{{l.t}}</button>
</sc-for>
</div>
<div class="mono" style="font-size: 13px; color: #2C3640">Puesta: AI 3246.466 (libreta, compensada) · ✓ circuito cerrado</div>
</div>

<div style="margin: 10px 16px 0; background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 12px; padding: 8px">
<svg width="340" height="170" viewBox="0 0 340 170" aria-hidden="true">
<g stroke="#E4E8EC"><line x1="30" y1="20" x2="330" y2="20"></line><line x1="30" y1="70" x2="330" y2="70"></line><line x1="30" y1="120" x2="330" y2="120"></line></g>
<polyline points="30,62 90,60 150,58 210,63 270,61 330,57" fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-dasharray="7 4"></polyline>
<polyline points="30,122 90,120 150,118 210,{{y80}} 270,121 330,117" fill="none" stroke="#8A5A1E" stroke-width="2.5"></polyline>
<line x1="{{scanX}}" y1="14" x2="{{scanX}}" y2="150" stroke="#10161D" stroke-width="1.2" stroke-dasharray="4 4"></line>
<line x1="{{scanX}}" y1="{{scanY1}}" x2="{{scanX}}" y2="{{scanY2}}" stroke="#C2410C" stroke-width="4"></line>
<g font-family="IBM Plex Mono" font-size="11" fill="#2C3640"><text x="30" y="164">0+000</text><text x="150" y="164">0+060</text><text x="290" y="164">0+120</text></g>
<g font-size="11" font-weight="600"><text x="34" y="52" fill="#1D4ED8">Base a dar</text><text x="34" y="140" fill="#8A5A1E">Subrasante medida</text></g>
</svg>
<input type="range" min="0" max="5" step="1" value="{{i}}" onInput="{{mover}}" aria-label="Progresiva" style="width: 100%; height: 32px; accent-color: #10161D">
</div>

<div style="margin: 10px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<div style="background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 10px; padding: 10px 12px"><div style="font-size: 13px; color: #4A5561">En {{f.prog}}, cota</div><div class="mono" style="font-size: 20px; font-weight: 600">{{f.cota}}</div></div>
<div style="background: #10161D; color: #FFFFFF; border-radius: 10px; padding: 10px 12px"><div style="font-size: 13px; color: #AEB8C2">La mira debe marcar</div><div class="mono" style="font-size: 26px; font-weight: 700">{{f.lec}}</div></div>
</div>
<div style="margin: 8px 16px 0; background: {{f.bg}}; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.4"><b style="color: {{f.fg}}">{{f.sim}} {{f.t}}</b> · {{f.d}}</div>

<div style="margin: 10px 16px 0; flex: 1; min-height: 0; background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 12px; overflow: hidden">
<div style="display: grid; grid-template-columns: 70px 1fr 1fr 64px; padding: 8px 12px; font-size: 12px; color: #4A5561; border-bottom: 1px solid #D5DAE0"><span>Prog.</span><span>Cota</span><span>Mira</span><span>Pend.</span></div>
<sc-for list="{{filas}}" as="r" hint-placeholder-count="6">
<div class="mono" style="display: grid; grid-template-columns: 70px 1fr 1fr 64px; padding: 7px 12px; font-size: 14px; background: {{r.bg}}; border-bottom: 1px solid #EEF1F4"><span>{{r.prog}}</span><span>{{r.cota}}</span><b>{{r.lec}}</b><span>{{r.pend}}</span></div>
</sc-for>
</div>
<div style="padding: 10px 16px 14px; display: flex; gap: 8px">
<button type="button" style="flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid #B8C1CB; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #10161D">Separación ✓ ≥ 0.18 m</button>
<button type="button" style="flex: 1; min-height: 48px; border-radius: 10px; border: 0; background: #C2410C; color: #FFFFFF; font-size: 15px; font-weight: 600">Hoja de estacas</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var F = [
  ['0+000', '3244.300', '2.166', '−0.35 %', 'Interpolado', 'Sobre la subrasante medida, comprobada.', 'ok'],
  ['0+020', '3244.230', '2.236', '−0.35 %', 'Interpolado', 'Sobre la subrasante medida, comprobada.', 'ok'],
  ['0+040', '3244.160', '2.306', '−0.30 %', 'Interpolado', 'Sobre la subrasante medida, comprobada.', 'ok'],
  ['0+060', '3244.100', '2.366', '−0.40 %', 'Interpolado', 'Sobre la subrasante medida, comprobada.', 'ok'],
  ['0+080', '3244.020', '2.446', '−0.35 %', 'Ojo: la subrasante corta 54 mm aquí', 'Si se sigue la medida, la base queda 54 mm alta frente al proyecto. Corrige la subrasante o sigue la rasante.', 'mal'],
  ['0+130', '3243.850', '2.616', '−0.35 %', 'Extrapolado', 'Pasado el último punto medido (0+120): se prolonga la pendiente del último tramo.', 'lim']
];
var COL = { ok: ['#E3F2EF', '#0B5E56', '✓'], lim: ['#FFF7E0', '#8A5A00', '△'], mal: ['#FDECEC', '#9F1B1B', '✗'] };
var XS = [30, 90, 150, 210, 270, 330];
class Component extends DCLogic {
  state = { i: 4, lado: 1 };
  renderVals() {
    var s = this.state, self = this, r = F[s.i], c = COL[r[6]];
    return {
      i: s.i, scanX: XS[s.i], scanY1: [62, 60, 58, 63, 61, 57][s.i], scanY2: [122, 120, 118, 128, 121, 117][s.i], y80: 128,
      mover: function (e) { self.setState({ i: +e.target.value }); },
      lados: ['Borde izq.', 'Eje', 'Borde der.'].map(function (t, k) { var on = k === s.lado; return { t: t, on: on ? 'true' : 'false', bg: on ? '#10161D' : 'transparent', fg: on ? '#FFFFFF' : '#10161D', pick: function () { self.setState({ lado: k }); } }; }),
      f: { prog: r[0], cota: r[1], lec: r[2], t: r[4], d: r[5], sim: c[2], bg: c[0], fg: c[1] },
      filas: F.map(function (x, k) { return { prog: x[0], cota: x[1], lec: x[2], pend: x[3], bg: k === s.i ? '#F4F6F8' : '#FFFFFF' }; })
    };
  }
}
</script>
</body>
</html>
